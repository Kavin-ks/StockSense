version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/stocksense
      - JWT_SECRET=stocksense-secret-jwt-key-2026-very-secure
      - JWT_EXPIRES_IN=8h
      - CLIENT_ORIGIN=http://localhost:5174
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - PORT=5174
      - API_PROXY_TARGET=http://server:4000
    depends_on:
      - server
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stocksense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
